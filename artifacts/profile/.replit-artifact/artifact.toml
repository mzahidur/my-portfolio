kind = "web"
previewPath = "/"
title = "Muhammad Zahidur Rahman — Profile"
version = "1.0.0"
id = "artifacts/profile"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20602

[services.development]
run = "pnpm --filter @workspace/profile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/profile", "run", "build" ]
publicDir = "artifacts/profile/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20602"
BASE_PATH = "/"
